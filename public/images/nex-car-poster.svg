<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">NEX NX—01 concept Formula 1 car</title>
  <desc id="desc">An original isometric vector illustration of a generic open-wheel racing car. It is an educational concept and does not represent a specific regulated car.</desc>
  <defs>
    <linearGradient id="body" x1=".12" y1=".05" x2=".84" y2="1"><stop stop-color="#d5e87a"/><stop offset=".48" stop-color="#8eaa3d"/><stop offset="1" stop-color="#536b25"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6e882e"/><stop offset="1" stop-color="#354820"/></linearGradient>
    <linearGradient id="wing" x1="0" x2="1" y2="1"><stop stop-color="#e35a42"/><stop offset="1" stop-color="#9e3027"/></linearGradient>
    <radialGradient id="ground"><stop stop-color="#43532d" stop-opacity=".22"/><stop offset="1" stop-color="#43532d" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-.3" y="-.3" width="1.6" height="1.7"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <ellipse cx="625" cy="600" rx="390" ry="88" fill="url(#ground)" filter="url(#shadow)"/>
  <g fill="none" stroke="#536b25" stroke-opacity=".13" stroke-width="2">
    <ellipse cx="605" cy="380" rx="470" ry="188" transform="rotate(-17 605 380)"/>
    <ellipse cx="605" cy="380" rx="395" ry="152" transform="rotate(18 605 380)"/>
    <path d="M108 560 970 190"/>
  </g>
  <!-- wheels and their shaded inner faces -->
  <g transform="rotate(-13 600 405)">
    <g fill="#171b1a" stroke="#303733" stroke-width="8">
      <ellipse cx="345" cy="455" rx="48" ry="91" transform="rotate(-11 345 455)"/>
      <ellipse cx="825" cy="425" rx="55" ry="103" transform="rotate(-11 825 425)"/>
      <ellipse cx="440" cy="278" rx="40" ry="77" transform="rotate(-11 440 278)"/>
      <ellipse cx="865" cy="266" rx="42" ry="82" transform="rotate(-11 865 266)"/>
    </g>
    <g fill="#454c46" stroke="#81877e" stroke-width="4">
      <ellipse cx="346" cy="455" rx="19" ry="54" transform="rotate(-11 346 455)"/>
      <ellipse cx="826" cy="425" rx="22" ry="62" transform="rotate(-11 826 425)"/>
      <ellipse cx="441" cy="278" rx="16" ry="44" transform="rotate(-11 441 278)"/>
      <ellipse cx="866" cy="266" rx="17" ry="47" transform="rotate(-11 866 266)"/>
    </g>
    <!-- chassis body, side pod and tapered nose -->
    <path d="m364 392 98-75 137-47 133 19 108 77-8 34-115 15-97 61-209 8-96-45-61-17z" fill="url(#body)" stroke="#34471e" stroke-width="4" stroke-linejoin="round"/>
    <path d="m365 392 95-10 117 43 143 24-205 35-96-45-61-17z" fill="url(#side)"/>
    <path d="m470 317 126-58 71-4 61 39-119 37-82 52-63-19-53 9z" fill="url(#body)"/>
    <path d="m568 386 78-44 148-25 79 30-109 21-90 55-84-17z" fill="#bacb72"/>
    <path d="m643 343 87-25 76 9-76 27z" fill="#303c24"/>
    <!-- cockpit and halo -->
    <path d="m626 318 33-65q34-33 70 1l22 35-27 26-55 15z" fill="#202622" stroke="#333c31" stroke-width="5"/>
    <path d="m631 307q42-65 97-15l25 16" fill="none" stroke="#c0c5b6" stroke-width="9" stroke-linecap="round"/>
    <path d="m660 291q11-34 39-30l12 22-9 24-30 2z" fill="url(#wing)"/>
    <!-- front wing, rear wing and end plates -->
    <path d="m193 455 173-17 81 30-170 24z" fill="url(#wing)" stroke="#652c25" stroke-width="4"/>
    <path d="m232 482-13 48-19 1 11-48m93-5 1 53 22-2-7-57" fill="#303631"/>
    <path d="m924 393 128-46 12 17-119 47z" fill="#303631"/>
    <path d="m926 372 115-50 10 14-111 49z" fill="url(#wing)" stroke="#772e25" stroke-width="3"/>
    <path d="m1034 340 17-5 1 34-18 6z" fill="#303631"/>
    <!-- suspension arms -->
    <g stroke="#252c28" stroke-width="6" stroke-linecap="round"><path d="m427 353-79 77m41-35 70 64m337-129 47 138m-77-105 113 70"/></g>
    <path d="m568 397 202 22" stroke="#e4e9c5" stroke-opacity=".55" stroke-width="5"/>
    <path d="m657 346 22-7" stroke="#e34e3b" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
